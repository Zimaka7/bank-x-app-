# Server Configuration
server.port=9091
server.address=0.0.0.0

# Database Configuration - SEPARATE Bank Z Database Schema
spring.datasource.url=jdbc:postgresql://localhost:5433/bankx_db?currentSchema=bankz
spring.datasource.username=bankx_user
spring.datasource.password=bankx_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=bankz
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Application Configuration - Bank Z Specific
spring.application.name=bank-z-working
bankz.joining-bonus=500.00
bankz.savings-interest-rate=0.005
bankz.transaction-fee-rate=0.0005

# Bank X Integration Configuration
bankx.api.base-url=http://localhost:9090
bankx.api.key=bankz_secure_api_key_2024
bankx.api.timeout=30000

# Bank Z Business Configuration
bankz.transaction.batch-size=100
bankz.reconciliation.enabled=true
bankz.reconciliation.schedule=0 0 23 * * ?

# Security Configuration
bankz.api.key=bankz_internal_api_key_2024
bankz.security.enabled=true

# Logging Configuration
logging.level.com.bankz=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n