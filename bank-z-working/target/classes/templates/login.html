<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Z - Operator Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-university text-primary" style="font-size: 3rem;"></i>
                            <h2 class="fw-bold mt-3">Bank Z</h2>
                            <p class="text-muted">Operator Portal Login</p>
                        </div>
                        
                        <div th:if="${param.error}" class="alert alert-danger">
                            Invalid username or password.
                        </div>
                        
                        <div th:if="${param.logout}" class="alert alert-success">
                            You have been logged out successfully.
                        </div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        
                        <div class="mt-4">
                            <h6>Demo Credentials:</h6>
                            <div class="small">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div>
                                        <strong>Admin:</strong> admin / admin123
                                        <br><small class="text-muted">Full system access</small>
                                    </div>
                                    <button class="btn btn-sm btn-outline-primary copy-btn"
                                            onclick="fillCredentials('admin', 'admin123')">
                                        Use
                                    </button>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div>
                                        <strong>Operator:</strong> operator / operator123
                                        <br><small class="text-muted">Transaction operations</small>
                                    </div>
                                    <button class="btn btn-sm btn-outline-primary copy-btn"
                                            onclick="fillCredentials('operator', 'operator123')">
                                        Use
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
