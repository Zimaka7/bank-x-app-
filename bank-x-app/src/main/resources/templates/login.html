<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bank X</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
</head>
<body>
    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>Bank X</h1>
                <p style="color: var(--absa-dark-gray); margin-top: 0.5rem;">Secure Digital Banking</p>
            </div>
            
            <form th:action="@{/login}" method="post" id="loginForm">
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                
                <div class="form-group">
                    <label for="username" class="form-label">Username, Email, or Phone</label>
                    <input type="text" id="username" name="username" class="form-control" required 
                           placeholder="Enter username, email, or phone number" autocomplete="username">
                    <small class="form-text">You can login with your username, email address, or phone number</small>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required 
                           placeholder="Enter your password" autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1.5rem;">
                    🔐 Secure Login
                </button>
                
                <div style="text-align: center; margin-bottom: 2rem;">
                    <p>Don't have an account? <a th:href="@{/register}" style="color: var(--absa-red); font-weight: 600;">Register here</a></p>
                    <p><a th:href="@{/}" style="color: var(--absa-blue); font-weight: 500;">← Back to Home</a></p>
                </div>
            </form>
            
            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid var(--absa-light-gray);">
                <h4 style="color: var(--absa-red); margin-bottom: 1rem; text-align: center;">🎯 Demo Accounts</h4>
                <div class="demo-accounts">
                    <div class="demo-account">
                        <div class="demo-type">👨‍💼 Admin Access</div>
                        <div class="demo-credentials">
                            <span class="demo-username">admin</span> / <span class="demo-password">admin123</span>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="fillAdminCredentials()">Quick Login</button>
                    </div>
                    <div class="demo-account">
                        <div class="demo-type">👤 Customer Access</div>
                        <div class="demo-credentials">Register a new account to get started</div>
                        <a th:href="@{/register}" class="btn btn-primary btn-sm">Create Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .demo-accounts {
            display: grid;
            gap: 1rem;
        }
        
        .demo-account {
            background: rgba(248, 249, 250, 0.8);
            padding: 1rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--absa-light-gray);
            text-align: center;
        }
        
        .demo-type {
            font-weight: 600;
            color: var(--absa-red);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .demo-credentials {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--absa-dark-gray);
            margin-bottom: 0.75rem;
            background: white;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        .demo-username, .demo-password {
            font-weight: 600;
            color: var(--absa-blue);
        }
        
        .auth-card {
            animation: slideInUp 0.6s ease-out;
        }
        
        @keyframes slideInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .form-control:focus {
            transform: translateY(-2px);
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>

    <script th:src="@{/js/bankx.js}"></script>
    <script>
        function fillAdminCredentials() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
            
            // Add visual feedback
            document.getElementById('username').classList.add('is-valid');
            document.getElementById('password').classList.add('is-valid');
            
            if (window.bankX && window.bankX.notifications) {
                bankX.notifications.info(
                    'Demo Credentials Filled',
                    'Admin credentials have been filled. Click "Secure Login" to continue.',
                    4000,
                    'demo-credentials-' + Date.now()
                );
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Welcome message for login page
            setTimeout(() => {
                if (window.bankX && window.bankX.notifications) {
                    bankX.notifications.security(
                        'Secure Login Portal',
                        'Your connection is encrypted and secure. Enter your credentials to access your account.',
                        6000,
                        'login-welcome'
                    );
                }
            }, 1000);
            
            // Add form validation feedback
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', function(e) {
                if (window.bankX && window.bankX.notifications) {
                    bankX.notifications.info(
                        'Authenticating...',
                        'Please wait while we verify your credentials.',
                        3000,
                        'login-auth-' + Date.now()
                    );
                }
            });
        });
    </script>
</body>
</html>
